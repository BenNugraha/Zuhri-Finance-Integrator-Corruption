[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zfic"
version = "3.0.0"
description = "Zuhri Financial Integrity Core - toolkit analitis deteksi anomali harga, risk scoring, dan audit trail (bukan alat eksekusi finansial)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0,<4.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
    "mpmath>=1.3,<2.0",
]

[project.optional-dependencies]
server = ["gunicorn>=21.2,<23.0"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["zfic"]
